# cargo-audit configuration
# https://docs.rs/cargo-audit/latest/cargo_audit/config/

[advisories]
ignore = [
  # wasmtime: type indices can be mixed up between engines.
  # Pulled in transitively via near-vm-runner (near-sdk's `unit-testing`
  # dev/test-only feature, restricted to cfg(not(target_arch = "wasm32"))),
  # never linked into the on-chain contract wasm.
  "RUSTSEC-2026-0222",
  "RUSTSEC-2026-0253",
  "RUSTSEC-2026-0269",

  # rustls <0.23.45: Reached only via near-kit's test harness. 
  # Never linked into the contract wasm.
  #
  # BLOCKED: rustls >=0.23.45 requires aws-lc-rs ^1.18, but near-crypto 0.37.3
  # (latest stable, via near-sdk) pins aws-lc-rs "=1.16.2". Remove this entry
  # once nearcore relaxes that pin.
  "RUSTSEC-2026-0285",
]
