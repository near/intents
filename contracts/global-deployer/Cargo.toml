lints.workspace = true

[package]
name = "defuse-global-deployer"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-account-id.workspace = true
thiserror.workspace = true

arbitrary = { workspace = true, features = ["derive"], optional = true }
borsh = { workspace = true, features = ["derive"], optional = true }
cfg_eval = { workspace = true, optional = true }
defuse-borsh-utils = { workspace = true, optional = true }
defuse-digest = { workspace = true, features = ["sha2"], optional = true }
defuse-serde-utils = { workspace = true, features = ["hex"], optional = true }
near-kit = { workspace = true, optional = true }
near-sdk = { workspace = true, features = ["deterministic-account-ids"], optional = true }
schemars = { workspace = true, features = ["derive"], optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_with = { workspace = true, features = ["hex"], optional = true }

[features]
abi = ["borsh-schema", "near-sdk?/abi", "schemars-v0_8"]
arbitrary = ["dep:arbitrary", "near-account-id/arbitrary"]
borsh = ["dep:borsh", "near-account-id/borsh"]
borsh-schema = [
  "borsh",
  "borsh/unstable__schema",
  "defuse-borsh-utils?/schema",
  "near-account-id/abi",
]
digest = ["dep:defuse-digest"]
near-contract = [
  "borsh",
  "dep:defuse-borsh-utils",
  "dep:defuse-serde-utils",
  "dep:near-sdk",
  "serde",
]
near-kit = [
  "borsh",
  "dep:defuse-borsh-utils",
  "dep:defuse-serde-utils",
  "dep:near-kit",
  "serde",
]
serde = ["dep:cfg_eval", "dep:serde", "dep:serde_with", "near-account-id/serde"]
schemars-v0_8 = [
  "defuse-serde-utils?/schemars-v0_8",
  "dep:schemars",
  "near-account-id/schemars-v0_8",
  "serde",
  "serde_with?/schemars_0_8",
]

# Enable building actual smart-contract exported functions
_contract = ["digest", "near-contract"]

[dev-dependencies]
defuse-global-deployer = { path = ".", features = ["abi", "arbitrary", "borsh", "digest", "near-contract", "serde", "_contract", "near-kit"] }

hex-literal.workspace = true
near-sdk = { workspace = true, features = ["non-contract-usage"] }

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = [
  "cargo",
  "near",
  "build",
  "non-reproducible-wasm",
  "--locked",
  "--features=_contract",
  "--abi-features=abi,_contract",
]
