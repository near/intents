lints.workspace = true

[package]
name = "defuse-outlayer-app"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
defuse-outlayer-app-core = { workspace = true, features = ["borsh", "serde"] }
defuse-serde-utils = { workspace = true, features = ["hex"] }
near-sdk.workspace = true

[features]
abi = ["defuse-outlayer-app-core/abi", "defuse-serde-utils/abi", "near-sdk/abi"]
contract = []

[dev-dependencies]
defuse-outlayer-app = { path = ".", features = ["abi"] }

clap = { workspace = true, features = ["wrap_help"] }
hex.workspace = true
near-sdk = { workspace = true, features = ["non-contract-usage"] }
url.workspace = true

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = [
  "cargo",
  "near",
  "build",
  "non-reproducible-wasm",
  "--locked",
  "--features=contract",
  "--abi-features=abi,contract",
]
