lints.workspace = true

[package]
name = "defuse-treasury-logger"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
defuse-borsh-utils.workspace = true
defuse-near-utils = { workspace = true, features = ["borsh"] }
defuse-nep245 = { workspace = true, features = ["near-contract"] }
defuse-serde-utils.workspace = true

borsh = { workspace = true, features = ["derive"] }
impl-tools.workspace = true
near-sdk.workspace = true
serde_with.workspace = true

[features]
abi = [
  "borsh/unstable__schema",
  "defuse-borsh-utils/schema",
  "defuse-near-utils/abi",
  "defuse-nep245/abi",
  "defuse-serde-utils/schemars-v0_8",
  "near-sdk/abi",
  "serde_with/schemars_0_8",
]

[dev-dependencies]
defuse-treasury-logger = { path = ".", features = ["abi"] }

near-sdk = { workspace = true, features = ["unit-testing"] }
rstest.workspace = true

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = [
  "cargo",
  "near",
  "build",
  "non-reproducible-wasm",
  "--locked",
  "--abi-features=abi",
]
