lints.workspace = true

[package]
name = "defuse-wallet-ed25519"
edition.workspace = true
version = "0.1.0"
rust-version.workspace = true
repository.workspace = true
readme = "../README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
defuse-crypto = { workspace = true, features = ["borsh", "ed25519", "fmt"] }
defuse-wallet = { workspace = true, features = ["borsh", "digest"] }

defuse-wallet-sdk = { workspace = true, optional = true }
derive_more = { workspace = true, features = ["as_ref", "from"], optional = true }
near-sdk = { workspace = true, optional = true }

[features]
abi = ["defuse-crypto/abi", "defuse-wallet/abi", "near-sdk?/abi"]

signer = ["defuse-crypto/signing", "dep:defuse-wallet-sdk", "dep:derive_more"]

contract = [
  "defuse-crypto/borsh",
  "defuse-wallet/near-contract",
  "dep:near-sdk",
]

[dev-dependencies]
defuse-wallet-ed25519 = { path = ".", features = ["abi", "signer", "contract"] }

hex-literal.workspace = true
rand = { workspace = true, features = ["sys_rng"] }
rstest.workspace = true
tokio-test.workspace = true

near-sdk = { workspace = true, features = ["unit-testing"] }

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.97.1"
image_digest = "sha256:7467038bdddc86484b73b416eeadce926ff59013e128e53dec5a19e1cb4b2234"
passed_env = []
container_build_command = [
  "cargo",
  "near",
  "build",
  "non-reproducible-wasm",
  "--locked",
  "--no-default-features",
  "--features=contract",
  "--abi-features=abi,contract",
]

[package.metadata.cargo-machete]
# needed for `wallet!` macro, since `#[near(...)]` doesn't support re-exports
ignored = ["near-sdk"]
