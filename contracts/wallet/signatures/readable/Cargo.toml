lints.workspace = true

[package]
name = "defuse-wallet-readable"
edition.workspace = true
version = "0.1.0"
rust-version.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
defuse-wallet = { workspace = true, features = ["borsh", "json", "serde"] }
