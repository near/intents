lints.workspace = true

[package]
name = "defuse-mpc-signer"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
defuse-crypto = { workspace = true, features = ["ed25519", "secp256k1", "serde"] }
defuse-mpc-kdf = { workspace = true, features = ["ed25519", "secp256k1"] }

impl-tools.workspace = true
near-kit = { workspace = true, default-features = false, features = ["contracts", "rpc"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_with = { workspace = true, features = ["hex"] }
thiserror.workspace = true

tracing = { workspace = true, optional = true }

[features]
tracing = ["dep:tracing", "near-kit/tracing"]

[package.metadata.cargo-machete]
ignored = [
  "defuse-crypto", # needed to activate "serde" feature
]
