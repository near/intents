lints.workspace = true

[package]
name = "defuse-nep245"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
defuse-serde-utils.workspace = true
derive_more = { workspace = true, features = ["from"] }
near-account-id = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_with.workspace = true
thiserror.workspace = true

defuse-near-utils = { workspace = true, optional = true }
near-sdk = { workspace = true, optional = true }
schemars = { workspace = true, features = ["derive"], optional = true }

[features]
abi = [
  "defuse-serde-utils/schemars-v0_8",
  "dep:schemars",
  "near-account-id/abi",
  "serde_with/schemars_0_8",
]
near-contract = ["dep:defuse-near-utils", "dep:near-sdk"]

[dev-dependencies]
defuse-nep245 = { workspace = true, features = ["near-contract"] }
near-sdk = { workspace = true, features = ["unit-testing"] }
