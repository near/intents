lints.workspace = true

[package]
name = "defuse-near-utils"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
impl-tools.workspace = true
near-sdk = { workspace = true, optional = true }

borsh = { workspace = true, features = ["derive"], optional = true }
defuse-borsh-utils = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }

[features]
abi = ["borsh-schema"]
borsh = ["dep:borsh", "dep:defuse-borsh-utils"]
borsh-schema = ["borsh", "borsh/unstable__schema"]
near-contract = ["borsh", "dep:serde", "dep:near-sdk",]

[dev-dependencies]
defuse-test-utils.workspace = true

near-sdk = { workspace = true, features = ["unit-testing"] }
rstest.workspace = true
