borsh = ["dep:borsh"]
borsh-schema = ["borsh", "borsh/unstable__schema"]
schemars-v0_8 = ["dep:schemars", "serde"]
serde = ["dep:serde_with"]

[dev-dependencies]
rstest.workspace = true
