lints.workspace = true

[package]
name = "defuse-wallet-sdk"
edition.workspace = true
version = "0.1.0"
rust-version.workspace = true
repository.workspace = true

[dependencies]
defuse-wallet = { workspace = true, features = ["borsh", "digest"] }

async-trait.workspace = true
borsh.workspace = true
impl-tools.workspace = true
rand.workspace = true
trait-variant.workspace = true

bs58 = { workspace = true, optional = true }
defuse-mpc-signer = { workspace = true, optional = true }
defuse-near-sender = { workspace = true, features = ["near-kit"], optional = true }
derive_more = { workspace = true, features = ["from"], optional = true }
near-kit = { workspace = true, default-features = false, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[features]
default = ["relayer"] # TODO: add more

json = ["defuse-wallet/json", "serde"]
near-kit = [
  "defuse-wallet/near-kit",
  "dep:derive_more",
  "dep:near-kit",
  "derive_more/from",
  "serde",
]
mpc = ["dep:defuse-mpc-signer", "relayer"]
relayer = ["dep:defuse-near-sender", "dep:thiserror", "near-kit"]
serde = ["defuse-near-sender?/serde", "defuse-wallet/serde", "dep:serde"]
tracing = ["dep:bs58", "dep:tracing"]

[dev-dependencies]
defuse-wallet-sdk = { path = ".", features = ["json", "near-kit", "relayer", "serde", "mpc"] }
