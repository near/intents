lints.workspace = true

[package]
name = "near-wallet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "near-cli-rs extension for signing wallet-contract requests with NEP-413"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap = { workspace = true, features = ["derive", "wrap_help"] }
color-eyre = "0.6"
defuse-crypto = { workspace = true, features = ["ed25519", "fmt", "serde"] }
defuse-nep413 = { workspace = true, features = ["serde"] }
defuse-wallet = { workspace = true, features = ["nep413", "serde"] }
inquire = "0.9.3"
interactive-clap = "0.3.2"
near-account-id = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
shell-words = "1"
# interactive-clap 0.3 generates code against strum 0.24's traits.
strum = { version = "0.24", features = ["derive"] }

[dev-dependencies]
hex-literal.workspace = true

[package.metadata.cargo-machete]
# Referenced by code generated by the `interactive-clap` derive.
ignored = ["clap"]
